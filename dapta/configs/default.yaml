# =============================================================================
# DAPTA — Default Configuration
# All hyperparameters and paths in one place.
# Override per-experiment via CLI or experiment-specific YAML files.
# =============================================================================

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  data_dir: "data/aphasiabank"          # Root of AphasiaBank CHAT files
  processed_dir: "data/processed"       # Processed state vectors & splits
  models_dir: "models"                  # Saved model checkpoints
  results_dir: "results"                # Evaluation outputs & plots
  logs_dir: "logs"                      # Training logs

# ---------------------------------------------------------------------------
# Dataset splits
# ---------------------------------------------------------------------------
dataset:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  min_sessions_for_longitudinal: 2      # Min sessions to be used in PES

# ---------------------------------------------------------------------------
# DAE — Discourse Assessment Engine
# ---------------------------------------------------------------------------
dae:
  # Discourse metrics
  metrics:
    - ciu_rate         # Correct information units per minute
    - mc_score         # Main concept completeness [0-1]
    - mlu_morphemes    # Mean length of utterance in morphemes
    - ttr              # Type-token ratio
    - syntactic_complexity   # Subordinate clause ratio
    - mean_surprisal   # RoBERTa surprisal (lower = better)

  # Metric weights for reward function (must sum to 1.0)
  # CIU rate is highest per Stark et al. (2021)
  metric_weights:
    ciu_rate: 0.35
    mc_score: 0.25
    mlu_morphemes: 0.10
    ttr: 0.10
    syntactic_complexity: 0.05
    mean_surprisal: 0.15   # Inverse: improvement = reduction

  # RoBERTa fine-tuning
  roberta:
    model_name: "roberta-base"
    max_length: 256
    mlm_probability: 0.15
    learning_rate: 2.0e-5
    batch_size: 16
    num_epochs: 5
    warmup_ratio: 0.1
    weight_decay: 0.01
    early_stopping_patience: 2
    checkpoint_path: "models/roberta_aphasiabank"

  # Task types in AphasiaBank protocol
  discourse_tasks:
    - cookie_theft       # Picture description (WAB Cookie Theft)
    - cinderella         # Story retelling
    - sandwich           # Procedural description
    - stroke_narrative   # Personal narrative
    - conversation       # Unstructured conversation

  # Tasks used for TRAINING the RL agent
  training_tasks:
    - cookie_theft
    - cinderella
    - sandwich

  # Tasks used for GENERALISATION TEST (held out, naturalistic)
  generalisation_tasks:
    - stroke_narrative
    - conversation

# ---------------------------------------------------------------------------
# PES — Patient Environment Simulator
# ---------------------------------------------------------------------------
pes:
  # Patient clustering
  clustering:
    n_clusters: 6                    
    method: "kmeans"
    features: ["aphasia_subtype_encoded", "wab_aq", "months_post_onset"]

  # Transition model (MLP)
  transition_model:
    hidden_sizes: [128, 64]
    activation: "relu"
    dropout: 0.2                     # MC Dropout for uncertainty
    learning_rate: 1.0e-3
    batch_size: 32
    num_epochs: 100
    early_stopping_patience: 10

  # MDP parameters
  mdp:
    episode_horizon: 20              # 20 simulated therapy sessions
    discount_factor: 0.95
    reward_clip: [-1.0, 1.0]         # Clip reward to prevent instability

# ---------------------------------------------------------------------------
# PRTA — Personalised RL Therapy Agent
# ---------------------------------------------------------------------------
prta:
  # Action space
  n_actions: 12                      # 12 therapy exercise types

  # Training
  total_timesteps: 50000             # Per patient cluster
  eval_freq: 1000
  n_eval_episodes: 10

  # DDQN hyperparameters
  ddqn:
    learning_rate: 1.0e-4
    buffer_size: 10000
    batch_size: 64
    gamma: 0.95
    tau: 0.005                       # Soft target update
    target_update_interval: 100
    exploration_fraction: 0.3
    exploration_final_eps: 0.05
    gru_hidden_size: 128
    gru_num_layers: 2
    dueling: true
    prioritised_replay: true
    per_alpha: 0.6                   # PER priority exponent
    per_beta_start: 0.4              # PER importance sampling start
    per_beta_end: 1.0

  # PPO hyperparameters (SB3)
  ppo:
    learning_rate: 3.0e-4
    n_steps: 512
    batch_size: 64
    n_epochs: 10
    gamma: 0.95
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  significance_level: 0.05
  min_effect_size: 0.4               # Cohen's d threshold (iTalkBetter benchmark)
  n_bootstrap: 1000                  # Bootstrap resamples for CIs
  baselines:
    - "rule_based"                   # RBDE
    - "random"                       # RTS
    - "generalised_ddqn"             # G-DDQN
