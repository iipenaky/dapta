# ============================================================
# aphasia_rl/config.yaml
# ALL parameters live here. Nothing is hardcoded in the code.
# ============================================================

project:
  name: "aphasia_rl"
  seed: 42
  device: "auto"           # "auto" | "cpu" | "cuda"

paths:
  raw_cha:        "data/raw"           # put your .cha files here
  clan_outputs:   "data/clan_outputs"  # put your .cex / .eval.xls files here
  processed:      "data/processed"
  models:         "models"
  results:        "results"
  logs:           "logs"

# ── PHASE 1: CHA PARSING ────────────────────────────────────
parsing:
  participant_tier: "PAR"       # speaker label in your .cha files
  investigator_tier: "INV"
  tasks_to_include:             # @G: markers to extract — null = all
    - "Stroke"
    - "Cinderella"
    - "Sandwich"
    - "Picture"
    - "Window"
    - "Speech"
  min_utterances: 5             # skip tasks with fewer PAR utterances
  maze_markers:                 # CHAT markers for mazes/fillers
    - "&-"
    - "&+"
    - "[/]"
    - "[//]"
    - "[///]"
  unintelligible_marker: "xxx"
  error_tier: "%err"

# ── PHASE 2: CLAN METRIC PARSING ────────────────────────────
clan:
  mlu_extension:  ".mlu.cex"
  freq_extension: ".frq.cex"
  vocd_extension: ".vocd.cex"
  eval_extension: ".eval.xls"

# ── PHASE 3: DISCOURSE METRICS ──────────────────────────────
metrics:
  # Weights for composite reward — must sum to 1.0
  reward_weights:
    mlu_words:    0.20
    vocd_d:       0.20
    ttr:          0.15
    ndw:          0.15
    ciu_approx:   0.20
    maze_ratio:   0.10      # inverted — lower maze = better
  normalize: true           # z-score normalize before weighting
  min_tokens: 20            # skip transcripts with fewer tokens

# ── PHASE 4: LLM VALIDATION ─────────────────────────────────
llm:
  model_name: "google/flan-t5-large"   # HuggingFace model
  # Alternatives (uncomment to use):
  # model_name: "microsoft/Phi-3-mini-4k-instruct"
  # model_name: "google/flan-t5-large"
  device_map: "auto"
  max_new_tokens: 256
  temperature: 0.1
  batch_size: 4
  validation:
    kappa_threshold: 0.60     # minimum acceptable Cohen's Kappa
    pearson_threshold: 0.70   # minimum acceptable Pearson r
    sample_size: 50           # number of transcripts to validate on

# ── PHASE 5: RL ENVIRONMENT ─────────────────────────────────
environment:
  therapy_exercises:
    - name: "anomia_drill"
      description: "Word-finding / naming exercises"
      targets: ["ndw", "ttr"]
    - name: "sentence_production"
      description: "Sentence-level construction tasks"
      targets: ["mlu_words"]
    - name: "narrative_discourse"
      description: "Story retelling and picture description"
      targets: ["ciu_approx", "vocd_d"]
    - name: "semantic_feature"
      description: "Semantic Feature Analysis"
      targets: ["ndw", "vocd_d"]
    - name: "conversational_practice"
      description: "Functional conversation practice"
      targets: ["ciu_approx", "maze_ratio"]
    - name: "reading_aloud"
      description: "Reading and repetition tasks"
      targets: ["mlu_words", "maze_ratio"]
  state_features:            # columns from metrics CSV used as state
    - "mlu_words"
    - "vocd_d"
    - "ttr"
    - "ndw"
    - "ciu_approx"
    - "maze_ratio"
    - "wab_aq"
    - "aphasia_subtype_encoded"
    - "age"
    - "session_number"
  max_episode_steps: 20     # max exercises per simulated session
  n_simulated_patients: 500 # synthetic patients for RL training
  transition_noise: 0.1     # Gaussian noise on simulated transitions

# ── PHASE 6: RL TRAINING ────────────────────────────────────
training:
  algorithms: ["PPO", "DQN"]   # both will be trained and compared
  total_timesteps: 200000
  eval_freq: 5000
  n_eval_episodes: 20
  test_split: 0.2
  val_split: 0.1

  # Optuna hyperparameter tuning
  optuna:
    n_trials: 50
    timeout_seconds: 3600      # 1 hour max per algorithm
    n_jobs: 1
    direction: "maximize"      # maximize cumulative reward
    pruner: "MedianPruner"

  # PPO search space (Optuna will search within these bounds)
  ppo:
    learning_rate: [1.0e-5, 1.0e-3]    # log-uniform
    n_steps: [512, 4096]               # int
    batch_size: [32, 512]              # int
    n_epochs: [3, 20]                  # int
    gamma: [0.90, 0.999]               # uniform
    gae_lambda: [0.90, 0.999]          # uniform
    clip_range: [0.1, 0.4]             # uniform
    ent_coef: [1.0e-8, 0.1]            # log-uniform
    vf_coef: [0.1, 1.0]                # uniform
    net_arch: ["small", "medium", "large"]  # mapped in code

  # DQN search space
  dqn:
    learning_rate: [1.0e-5, 1.0e-3]
    buffer_size: [10000, 100000]
    learning_starts: [500, 5000]
    batch_size: [32, 256]
    tau: [0.001, 0.1]
    gamma: [0.90, 0.999]
    train_freq: [1, 16]
    gradient_steps: [1, 8]
    target_update_interval: [100, 1000]
    exploration_fraction: [0.05, 0.3]
    exploration_final_eps: [0.01, 0.1]
    net_arch: ["small", "medium", "large"]

  net_arch_map:
    small:  [64, 64]
    medium: [128, 128]
    large:  [256, 256, 128]

# ── PHASE 7: EVALUATION ─────────────────────────────────────
evaluation:
  baselines:
    - "random"           # random exercise selection
    - "round_robin"      # fixed cyclic sequence
    - "most_common"      # always pick most frequent exercise
  significance_level: 0.05
  effect_size_threshold: 0.3   # Cohen's d threshold for meaningful effect
  plots:
    - "learning_curves"
    - "reward_comparison"
    - "metric_trajectories"
    - "subgroup_analysis"
    - "correlation_heatmap"
